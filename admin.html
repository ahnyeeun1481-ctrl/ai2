<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈페이지 콘텐츠 관리</title>
  <style>
    :root { color-scheme: dark; --bg:#101014; --panel:#19191f; --text:#f6f3ef; --muted:#a5a2aa; --red:#fa3448; --yellow:#ffd84d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.65 "Segoe UI","Noto Sans KR",sans-serif; }
    main { width:min(900px,92%); margin:48px auto 90px; }
    h1,h2 { margin:0 0 12px; }
    h1 { font-size:clamp(28px,5vw,42px); }
    h2 { margin-top:34px; font-size:22px; }
    p { color:var(--muted); }
    .notice { padding:14px 16px; border-left:3px solid var(--yellow); background:#211f19; color:#eee4c3; }
    form { display:grid; gap:16px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    label { display:grid; gap:6px; color:#ded9df; font-size:13px; }
    input,textarea { width:100%; padding:11px 12px; border:1px solid #393840; border-radius:5px; background:#121217; color:var(--text); font:inherit; }
    textarea { min-height:95px; resize:vertical; }
    .work { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:16px; border:1px solid #34323a; background:var(--panel); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    button,.file-button { display:inline-flex; align-items:center; justify-content:center; padding:11px 16px; border:1px solid #4b4852; border-radius:4px; background:#24232a; color:var(--text); cursor:pointer; font:inherit; }
    button.primary { border-color:var(--red); background:var(--red); font-weight:700; }
    button:hover,.file-button:hover { filter:brightness(1.12); }
    input[type=file] { display:none; }
    #status { min-height:1.6em; color:var(--yellow); }
    @media(max-width:620px) { main { margin-top:28px; } .grid,.work { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>홈페이지 콘텐츠 관리</h1>
  <p>내용은 이 PC의 <code>portfolio.db</code>에 저장됩니다. 저장 후 JSON을 내보내 공개 홈페이지에 반영할 수 있습니다.</p>
  <div class="notice">이 관리 도구는 <strong>이 컴퓨터에서만</strong> 동작합니다. GitHub Pages 방문자에게 SQLite DB가 직접 연결되지는 않습니다.</div>
  <form id="content-form">
    <h2>프로필</h2>
    <div class="grid">
      <label>이름<input name="name" required></label>
      <label>전공·관심 분야<input name="field" required></label>
      <label>관심 기술·연구 주제<input name="focus" required></label>
    </div>
    <label>공학 소개 문단 1<textarea name="about_paragraph_1" required></textarea></label>
    <label>공학 소개 문단 2<textarea name="about_paragraph_2" required></textarea></label>
    <label>작가 소개 문단 1<textarea name="writing_paragraph_1" required></textarea></label>
    <label>작가 소개 문단 2<textarea name="writing_paragraph_2" required></textarea></label>
    <h2>작품·작가 링크</h2>
    <div class="work" data-work="webnovels">
      <label>분류<input data-key="kind" value="웹소설" required></label>
      <label>플랫폼<input data-key="platform" value="GoodNovel" required></label>
      <label>링크 제목<input data-key="title" required></label>
      <label>URL<input data-key="url" type="url" required></label>
    </div>
    <div class="work" data-work="ebooks">
      <label>분류<input data-key="kind" value="전자책" required></label>
      <label>플랫폼<input data-key="platform" value="SSN" required></label>
      <label>링크 제목<input data-key="title" required></label>
      <label>URL<input data-key="url" type="url" required></label>
    </div>
    <div class="actions">
      <button class="primary" type="submit">SQLite에 저장</button>
      <button type="button" id="export">사이트 JSON 내보내기</button>
      <button type="button" id="download-db">SQLite DB 백업</button>
      <label class="file-button" for="import-file">JSON 불러오기</label>
      <input id="import-file" type="file" accept="application/json,.json">
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
  <section class="comments-admin" aria-labelledby="comments-heading">
    <h2 id="comments-heading">이 PC의 SQLite 댓글</h2>
    <p>이 댓글은 로컬 SQLite 데이터베이스에 저장된 댓글입니다. 공개 방문자가 남긴 브라우저 로컬 댓글은 여기에 나타나지 않습니다.</p>
    <ul id="admin-comments" class="admin-comments"></ul>
  </section>
</main>
<script>
const form = document.querySelector('#content-form');
const status = document.querySelector('#status');
const adminComments = document.querySelector('#admin-comments');
const works = () => [...document.querySelectorAll('.work')].map((card, index) => ({
  id: card.dataset.work,
  kind: card.querySelector('[data-key="kind"]').value,
  platform: card.querySelector('[data-key="platform"]').value,
  title: card.querySelector('[data-key="title"]').value,
  url: card.querySelector('[data-key="url"]').value,
  sort_order: index + 1
}));
const content = () => ({
  profile: Object.fromEntries(new FormData(form).entries()),
  works: works()
});
const populate = (data) => {
  for (const [key, value] of Object.entries(data.profile)) {
    const field = form.elements.namedItem(key);
    if (field) field.value = value;
  }
  for (const work of data.works) {
    const card = document.querySelector(`[data-work="${CSS.escape(work.id)}"]`);
    if (!card) continue;
    for (const key of ['kind', 'platform', 'title', 'url']) card.querySelector(`[data-key="${key}"]`).value = work[key];
  }
};
const loadComments = async () => {
  const response = await fetch('/api/comments');
  const comments = await response.json();
  adminComments.replaceChildren();
  if (!comments.length) {
    const empty = document.createElement('li'); empty.textContent = '저장된 댓글이 없습니다.'; adminComments.append(empty); return;
  }
  comments.forEach((comment) => {
    const item = document.createElement('li');
    const heading = document.createElement('strong'); heading.textContent = `${comment.author} · ${comment.created_at}`;
    const body = document.createElement('p'); body.textContent = comment.body;
    const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '삭제';
    remove.addEventListener('click', async () => {
      const result = await fetch(`/api/comments/${comment.id}`, {method:'DELETE'});
      if (result.ok) await loadComments();
    });
    item.append(heading,body,remove); adminComments.append(item);
  });
};
fetch('/api/content').then((response) => response.json()).then(populate).catch(() => {
  status.textContent = '로컬 API에서 내용을 불러오지 못했습니다. start_admin.bat으로 관리 도구를 실행했는지 확인해 주세요.';
});
loadComments().catch(() => { adminComments.textContent = '댓글을 불러오지 못했습니다.'; });
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const response = await fetch('/api/content', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(content()) });
  const result = await response.json();
  status.textContent = result.ok ? '저장했습니다. portfolio.db가 업데이트되었습니다.' : (result.error || '저장하지 못했습니다.');
});
document.querySelector('#export').addEventListener('click', async () => {
  try {
    const response = await fetch('/api/export');
    if (!response.ok) throw new Error('Export failed');
    const blob = await response.blob();
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'site-content.json'; link.click(); URL.revokeObjectURL(link.href);
    status.textContent = '홈페이지용 site-content.json을 내보냈습니다. GitHub 저장소 루트에 추가해 게시하세요.';
  } catch { status.textContent = 'JSON을 내보내지 못했습니다.'; }
});
document.querySelector('#download-db').addEventListener('click', () => {
  const link = document.createElement('a'); link.href = '/api/database'; link.download = 'portfolio.db'; link.click();
  status.textContent = 'SQLite 데이터베이스 백업을 다운로드했습니다.';
});
document.querySelector('#import-file').addEventListener('change', async (event) => {
  const file = event.target.files[0]; if (!file) return;
  try { populate(JSON.parse(await file.text())); status.textContent = 'JSON을 불러왔습니다. SQLite에 저장을 눌러 반영하세요.'; }
  catch { status.textContent = 'JSON 파일을 읽을 수 없습니다.'; }
  event.target.value = '';
});
</script>
</body>
</html>
